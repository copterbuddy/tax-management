operations:
  apply:
    guidance:
      - Start every code lookup in graphify-out/, never in the directory tree. Run
        graphify query with the question, then graphify explain on the node it
        returns, and open only the files the graph names. Do not walk directories
        or glob-sweep the repo to find code.
      - Graph node paths are repo-root relative. Read them bounded and grep to
        confirm before editing.
      - Run graphify update . after implementation so the graph stays truthful for
        the next change.
      - If graphify-out/ is missing when work starts, generate the graph before
        anything else. Run graphify extract . --code-only, then graphify
        cluster-only . --no-label. Do not start reading source files because the
        graph is absent.
